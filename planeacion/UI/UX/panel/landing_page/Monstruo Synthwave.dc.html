<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0c0723;}
  *{box-sizing:border-box;}
  @keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8);}50%{opacity:1;transform:scale(1.15);}}
  @keyframes gridmove{from{background-position:0 0,0 0;}to{background-position:0 44px,0 44px;}}
  @keyframes beamflick{0%,100%{opacity:.18;}45%{opacity:.4;}70%{opacity:.24;}}
  @keyframes portalpulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.85;}50%{transform:translate(-50%,-50%) scale(1.08);opacity:1;}}
  @keyframes ringspin{from{transform:translate(-50%,-50%) rotate(0deg);}to{transform:translate(-50%,-50%) rotate(360deg);}}
  @keyframes chevbob{0%,100%{transform:translate(-50%,0);opacity:.5;}50%{transform:translate(-50%,7px);opacity:1;}}
  @keyframes sweep{0%{opacity:.0;}50%{opacity:.5;}100%{opacity:0;}}
</style>
</helmet>
<div ref="{{ sceneRef }}" style="position:relative;width:100%;height:100vh;overflow:hidden;font-family:'Space Grotesk',sans-serif;background:linear-gradient(180deg,#0a0620 0%,#160d3e 42%,#2a1660 74%,#3a1c66 100%);">

  <!-- STARFIELD -->
  <div data-stars="1" style="position:absolute;inset:0;z-index:1;pointer-events:none;"></div>

  <!-- LIGHT BEAMS -->
  <div style="position:absolute;left:18%;top:-6%;width:120px;height:62%;z-index:1;background:linear-gradient(to bottom, rgba(120,200,255,.5), rgba(120,200,255,0));filter:blur(14px);transform:skewX(-7deg);mix-blend-mode:screen;animation:beamflick 6.5s ease-in-out infinite;"></div>
  <div style="position:absolute;left:46%;top:-6%;width:90px;height:54%;z-index:1;background:linear-gradient(to bottom, rgba(255,120,220,.45), rgba(255,120,220,0));filter:blur(16px);transform:skewX(5deg);mix-blend-mode:screen;animation:beamflick 8s ease-in-out infinite .8s;"></div>
  <div style="position:absolute;left:74%;top:-6%;width:110px;height:58%;z-index:1;background:linear-gradient(to bottom, rgba(150,120,255,.5), rgba(150,120,255,0));filter:blur(15px);transform:skewX(8deg);mix-blend-mode:screen;animation:beamflick 7.2s ease-in-out infinite .4s;"></div>

  <!-- BACKDROP SVG: sun, far city, mountains, architecture -->
  <svg viewBox="0 0 1440 810" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%;z-index:2;display:block;">
    <defs>
      <radialGradient id="warm" cx="50%" cy="100%" r="78%">
        <stop offset="0" stop-color="#ffb06b" stop-opacity=".55"/>
        <stop offset="42%" stop-color="#ff5c9d" stop-opacity=".28"/>
        <stop offset="100%" stop-color="#ff5c9d" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffe7b0"/>
        <stop offset="36%" stop-color="#ff8fc6"/>
        <stop offset="100%" stop-color="#9a45ff"/>
      </linearGradient>
      <linearGradient id="mtnBack" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4a2f86"/>
        <stop offset="100%" stop-color="#26174f"/>
      </linearGradient>
      <linearGradient id="mtnMid" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3a2270"/>
        <stop offset="100%" stop-color="#1b1140"/>
      </linearGradient>
      <linearGradient id="archfill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2c1c5e" stop-opacity=".85"/>
        <stop offset="100%" stop-color="#160d36" stop-opacity=".9"/>
      </linearGradient>
      <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="4.5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
    </defs>

    <!-- warm horizon glow -->
    <ellipse cx="720" cy="548" rx="820" ry="190" fill="url(#warm)"/>

    <!-- synth sun (behind character) -->
    <g filter="url(#glow)">
      <circle cx="720" cy="452" r="158" fill="url(#sun)"/>
      <rect x="560" y="470" width="320" height="9" rx="4" fill="#160d36"/>
      <rect x="560" y="492" width="320" height="12" rx="5" fill="#160d36"/>
      <rect x="560" y="520" width="320" height="16" rx="6" fill="#160d36"/>
    </g>

    <!-- far city silhouette -->
    <g fill="#241653" opacity=".9">
      <rect x="470" y="476" width="20" height="70"/>
      <rect x="500" y="452" width="26" height="94"/>
      <rect x="900" y="468" width="22" height="78"/>
      <rect x="930" y="440" width="30" height="106"/>
      <rect x="966" y="486" width="18" height="60"/>
    </g>
    <g fill="#7fd6ff" opacity=".8">
      <rect x="507" y="466" width="4" height="4"/><rect x="515" y="480" width="4" height="4"/>
      <rect x="507" y="500" width="4" height="4"/><rect x="938" y="456" width="4" height="4"/>
      <rect x="946" y="476" width="4" height="4"/><rect x="938" y="500" width="4" height="4"/>
    </g>

    <!-- BACK mountains -->
    <path d="M0,546 L0,470 L150,520 L300,420 L470,510 L560,452 L700,520 L760,520 L880,452 L980,512 L1150,418 L1300,512 L1440,468 L1440,546 Z" fill="url(#mtnBack)" opacity=".75"/>

    <!-- MID mountains with neon ridge -->
    <path d="M0,560 L0,520 L120,560 L250,452 L360,540 L470,500 L470,560 Z" fill="url(#mtnMid)"/>
    <path d="M970,560 L970,498 L1090,556 L1200,452 L1330,540 L1440,500 L1440,560 Z" fill="url(#mtnMid)"/>
    <path d="M0,520 L120,560 M120,560 L250,452 L360,540 L470,500" fill="none" stroke="#ff5c9d" stroke-width="2.4" filter="url(#glow)" opacity=".9"/>
    <path d="M970,498 L1090,556 L1200,452 L1330,540 L1440,500" fill="none" stroke="#ff5c9d" stroke-width="2.4" filter="url(#glow)" opacity=".9"/>

    <!-- LEFT architecture: dome-on-pillar + tower -->
    <g stroke-linecap="round" filter="url(#glow)">
      <!-- mushroom platform -->
      <g>
        <line x1="170" y1="430" x2="158" y2="548" stroke="#8a6bff" stroke-width="3"/>
        <line x1="210" y1="430" x2="222" y2="548" stroke="#8a6bff" stroke-width="3"/>
        <ellipse cx="190" cy="426" rx="70" ry="15" fill="url(#archfill)" stroke="#46e0ff" stroke-width="2.4"/>
        <path d="M150,420 a40,34 0 0 1 80,0 Z" fill="url(#archfill)" stroke="#46e0ff" stroke-width="2.4"/>
        <line x1="190" y1="384" x2="190" y2="356" stroke="#ff7ec6" stroke-width="2.4"/>
        <circle cx="190" cy="352" r="4" fill="#ff7ec6"/>
      </g>
      <!-- small dome -->
      <g>
        <path d="M250,548 L250,500 a48,40 0 0 1 96,0 L346,548 Z" fill="url(#archfill)" stroke="#8a6bff" stroke-width="2.2"/>
        <line x1="270" y1="548" x2="270" y2="506" stroke="#46e0ff" stroke-width="1.6" opacity=".7"/>
        <line x1="298" y1="548" x2="298" y2="498" stroke="#46e0ff" stroke-width="1.6" opacity=".7"/>
        <line x1="326" y1="548" x2="326" y2="506" stroke="#46e0ff" stroke-width="1.6" opacity=".7"/>
      </g>
      <!-- thin tower -->
      <g>
        <rect x="92" y="392" width="26" height="156" rx="4" fill="url(#archfill)" stroke="#ff7ec6" stroke-width="2"/>
        <line x1="92" y1="420" x2="118" y2="420" stroke="#46e0ff" stroke-width="1.6"/>
        <line x1="92" y1="448" x2="118" y2="448" stroke="#46e0ff" stroke-width="1.6"/>
        <line x1="92" y1="476" x2="118" y2="476" stroke="#46e0ff" stroke-width="1.6"/>
        <line x1="105" y1="392" x2="105" y2="360" stroke="#ff7ec6" stroke-width="2"/>
        <circle cx="105" cy="356" r="4" fill="#46e0ff"/>
      </g>
    </g>

    <!-- RIGHT architecture: ringed structure + radar dish + towers -->
    <g stroke-linecap="round" filter="url(#glow)">
      <!-- ringed planet structure -->
      <g>
        <circle cx="1255" cy="408" r="40" fill="url(#archfill)" stroke="#46e0ff" stroke-width="2.4"/>
        <ellipse cx="1255" cy="408" rx="66" ry="20" fill="none" stroke="#ff7ec6" stroke-width="2.4" transform="rotate(-18 1255 408)"/>
        <line x1="1255" y1="448" x2="1255" y2="548" stroke="#8a6bff" stroke-width="3"/>
      </g>
      <!-- radar dish -->
      <g>
        <line x1="1110" y1="548" x2="1110" y2="486" stroke="#8a6bff" stroke-width="3"/>
        <ellipse cx="1110" cy="476" rx="42" ry="20" fill="url(#archfill)" stroke="#46e0ff" stroke-width="2.2" transform="rotate(-24 1110 476)"/>
        <path d="M1090,486 a30,14 0 0 0 40,-20" fill="none" stroke="#ff7ec6" stroke-width="1.8" opacity=".8"/>
        <circle cx="1110" cy="476" r="4" fill="#ff7ec6"/>
      </g>
      <!-- domes -->
      <g>
        <path d="M1150,548 L1150,506 a40,34 0 0 1 80,0 L1230,548 Z" fill="url(#archfill)" stroke="#8a6bff" stroke-width="2.2"/>
        <line x1="1170" y1="548" x2="1170" y2="510" stroke="#46e0ff" stroke-width="1.6" opacity=".7"/>
        <line x1="1210" y1="548" x2="1210" y2="510" stroke="#46e0ff" stroke-width="1.6" opacity=".7"/>
      </g>
      <!-- tower -->
      <g>
        <rect x="1320" y="404" width="24" height="144" rx="4" fill="url(#archfill)" stroke="#ff7ec6" stroke-width="2"/>
        <line x1="1320" y1="430" x2="1344" y2="430" stroke="#46e0ff" stroke-width="1.6"/>
        <line x1="1320" y1="458" x2="1344" y2="458" stroke="#46e0ff" stroke-width="1.6"/>
        <line x1="1332" y1="404" x2="1332" y2="374" stroke="#46e0ff" stroke-width="2"/>
        <circle cx="1332" cy="370" r="4" fill="#ff7ec6"/>
      </g>
    </g>
  </svg>

  <!-- HORIZON GLOW BAR -->
  <div style="position:absolute;left:0;right:0;top:67.5%;height:3px;z-index:3;background:linear-gradient(90deg,transparent,var(--neon2,#38e8ff),var(--neon,#ff3df0),var(--neon2,#38e8ff),transparent);filter:blur(2px);opacity:.9;"></div>
  <div style="position:absolute;left:0;right:0;top:64%;height:60px;z-index:3;background:radial-gradient(ellipse 60% 100% at 50% 100%, color-mix(in srgb, var(--neon2,#38e8ff) 40%, transparent), transparent 70%);filter:blur(8px);"></div>

  <!-- NEON GRID FLOOR -->
  <div style="position:absolute;left:-30%;right:-30%;bottom:0;height:34%;z-index:3;transform:perspective(360px) rotateX(76deg);transform-origin:50% 0%;
       background-image:repeating-linear-gradient(90deg, transparent 0 43px, color-mix(in srgb, var(--neon,#ff3df0) 78%, transparent) 43px 44px), repeating-linear-gradient(0deg, transparent 0 43px, color-mix(in srgb, var(--neon2,#38e8ff) 70%, transparent) 43px 44px);
       background-size:44px 44px;mask-image:linear-gradient(to bottom, #000 0%, #000 55%, transparent 96%);-webkit-mask-image:linear-gradient(to bottom, #000 0%, #000 55%, transparent 96%);animation:gridmove 2.6s linear infinite;opacity:.85;"></div>

  <!-- PORTAL GLOW behind character -->
  <div style="position:absolute;left:50%;top:42%;width:50vmin;height:50vmin;z-index:4;transform:translate(-50%,-50%);background:radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--neon2,#38e8ff) 55%, transparent) 0%, color-mix(in srgb, var(--neon,#ff3df0) 22%, transparent) 38%, transparent 66%);filter:blur(6px);animation:portalpulse 4.6s ease-in-out infinite;pointer-events:none;"></div>
  <div style="position:absolute;left:50%;top:42%;width:38vmin;height:38vmin;z-index:4;transform:translate(-50%,-50%);border:2px solid color-mix(in srgb, var(--neon2,#38e8ff) 70%, transparent);border-radius:50%;box-shadow:0 0 26px color-mix(in srgb, var(--neon2,#38e8ff) 60%, transparent);opacity:.5;animation:ringspin 26s linear infinite;pointer-events:none;"></div>

  <!-- CHARACTER -->
  <div ref="{{ scaleRef }}" style="position:absolute;width:560px;height:640px;z-index:5;transform-origin:top center;will-change:transform;">
    <div ref="{{ shadowRef }}" style="position:absolute;left:50%;bottom:28px;width:300px;height:58px;transform:translateX(-50%);pointer-events:none;">
      <div style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse at 50% 50%, color-mix(in srgb, var(--neon2,#38e8ff) 60%, transparent) 0%, transparent 68%);opacity:.55;"></div>
      <div style="position:absolute;inset:6px 10px;border-radius:50%;border:2px solid var(--neon2,#38e8ff);box-shadow:0 0 18px var(--neon2,#38e8ff);opacity:.75;"></div>
      <div style="position:absolute;inset:20px 70px;border-radius:50%;border:1.5px solid var(--neon,#ff3df0);opacity:.6;"></div>
    </div>
    <div ref="{{ stageRef }}" style="position:absolute;inset:0;transform-origin:50% 92%;will-change:transform;filter:drop-shadow(0 0 18px color-mix(in srgb, var(--neon2,#38e8ff) 75%, transparent)) drop-shadow(0 0 46px color-mix(in srgb, var(--neon,#ff3df0) 45%, transparent));">
      <img data-key="blink1" src="frames/blink1.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:1;transition:opacity .05s linear;" />
      <img data-key="blink2" src="frames/blink2.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .05s linear;" />
      <img data-key="blink3" src="frames/blink3.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .05s linear;" />
      <img data-key="blink4" src="frames/blink4.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .05s linear;" />
      <img data-key="blink5" src="frames/blink5.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .05s linear;" />
      <img data-key="wave1" src="frames/wave1.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .05s linear;" />
      <img data-key="wave2" src="frames/wave2.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .05s linear;" />
      <img data-key="wave3" src="frames/wave3.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .05s linear;" />
      <img data-key="wave4" src="frames/wave4.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .05s linear;" />
      <img data-key="wave5" src="frames/wave5.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .05s linear;" />
      <img data-key="jump1" src="frames/jump1.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .05s linear;" />
      <img data-key="jump2" src="frames/jump2.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .05s linear;" />
      <img data-key="jump3" src="frames/jump3.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .05s linear;" />
      <img data-key="jump4" src="frames/jump4.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .05s linear;" />
      <img data-key="jump5" src="frames/jump5.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .05s linear;" />
    </div>
  </div>

  <!-- VIGNETTE -->
  <div style="position:absolute;inset:0;z-index:6;pointer-events:none;background:radial-gradient(ellipse 100% 80% at 50% 42%, transparent 52%, rgba(8,4,24,.55) 100%);"></div>

  <!-- NAV -->
  <nav style="position:absolute;top:0;left:0;right:0;z-index:7;display:flex;align-items:center;justify-content:space-between;padding:22px clamp(20px,4vw,56px);">
    <div style="display:flex;align-items:center;gap:10px;font-family:'Orbitron',sans-serif;font-weight:700;font-size:20px;letter-spacing:2px;color:#fff;text-shadow:0 0 14px var(--neon2,#38e8ff);">
      <span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--neon2,#38e8ff);box-shadow:0 0 14px var(--neon2,#38e8ff);"></span>BLU
    </div>
    <div style="display:flex;align-items:center;gap:clamp(14px,2.4vw,34px);font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:2.5px;color:#cdbdf2;">
      <span>PRODUCTO</span><span>EQUIPO</span><span>NOVEDADES</span><span>PRECIOS</span><span>CONTACTO</span>
    </div>
    <div style="padding:9px 20px;border-radius:999px;border:1.5px solid var(--neon2,#38e8ff);color:#fff;font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:2px;box-shadow:0 0 16px color-mix(in srgb, var(--neon2,#38e8ff) 55%, transparent);">ENTRAR</div>
  </nav>

  <!-- HERO TEXT -->
  <div style="position:absolute;left:50%;bottom:9.5%;z-index:7;transform:translateX(-50%);width:min(720px,88%);text-align:center;">
    <div style="font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:5px;color:var(--neon2,#38e8ff);text-shadow:0 0 12px var(--neon2,#38e8ff);margin-bottom:14px;">★ UNIVERSO SYNTHWAVE</div>
    <h1 ref="{{ headRef }}" style="margin:0;font-weight:700;font-size:clamp(34px,6vw,68px);line-height:1.02;color:#fff;letter-spacing:-.5px;text-shadow:0 0 28px rgba(120,90,255,.55);">Hola, soy Blu.</h1>
    <p ref="{{ subRef }}" style="margin:14px auto 24px;font-size:clamp(14px,1.8vw,19px);color:#bca9e6;max-width:30ch;">Tu compañero peludo del futuro retro.</p>
    <div style="display:inline-flex;align-items:center;gap:10px;padding:13px 28px;border-radius:999px;color:#0c0723;font-weight:600;font-size:15px;background:linear-gradient(92deg,var(--neon2,#38e8ff),var(--neon,#ff3df0));box-shadow:0 0 30px color-mix(in srgb, var(--neon,#ff3df0) 55%, transparent);cursor:pointer;">Saludar a Blu →</div>
  </div>

  <!-- SCROLL CHEVRON -->
  <div style="position:absolute;left:50%;bottom:18px;z-index:7;transform:translateX(-50%);width:38px;height:38px;border-radius:50%;border:1.5px solid color-mix(in srgb, var(--neon2,#38e8ff) 60%, transparent);display:flex;align-items:center;justify-content:center;color:var(--neon2,#38e8ff);animation:chevbob 2.2s ease-in-out infinite;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:720},&quot;headline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Hola, soy Loopi&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subhead&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Tu compañero peludo para la gestión académica.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;neon&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;mc&quot;,&quot;vp&quot;,&quot;cg&quot;,&quot;op&quot;],&quot;default&quot;:&quot;cg&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;speed&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0.5,&quot;min&quot;:0.4,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;},&quot;characterScale&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:1.45,&quot;min&quot;:0.6,&quot;max&quot;:1.5,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  refScene = (el) => { this.scene = el; this.applyScene(); };
  refScale = (el) => { this.scaleEl = el; };
  refShadow = (el) => { this.shadow = el; };
  refHead = (el) => { this.headEl = el; this.applyScene(); };
  refSub = (el) => { this.subEl = el; this.applyScene(); };
  refStage = (el) => { if (el) { this.stage = el; this.boot(); } };

  applyScene() {
    if (this.scene) {
      this.scene.style.height = window.innerHeight + 'px';
      const neon = this.props.neon || 'mc';
      const map = { mc:['#ff3df0','#38e8ff'], vp:['#a16bff','#ff5cc8'], cg:['#38e8ff','#5affc8'], op:['#ff7e5c','#ff3df0'] };
      const [n1, n2] = map[neon] || map.mc;
      this.scene.style.setProperty('--neon', n1);
      this.scene.style.setProperty('--neon2', n2);
    }
    if (this.headEl && this.props.headline != null && this.props.headline !== '') this.headEl.textContent = this.props.headline;
    if (this.subEl && this.props.subhead != null && this.props.subhead !== '') this.subEl.textContent = this.props.subhead;
  }

  componentDidUpdate() { this.applyScene(); }

  static easeInOut(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
  static easeOut(t){ return 1-Math.pow(1-t,3); }

  makeStars() {
    const layer = this.scene && this.scene.querySelector('[data-stars]');
    if (!layer || layer.childElementCount) return;
    const tint = ['#ffffff','#bfe8ff','#ffd0f4','#cdbcff'];
    for (let i=0;i<96;i++){
      const s = document.createElement('span');
      const sz = Math.random()<0.18 ? 3 : (Math.random()<0.5?2:1.5);
      const c = tint[(Math.random()*tint.length)|0];
      s.style.cssText = 'position:absolute;border-radius:50%;width:'+sz+'px;height:'+sz+'px;background:'+c+
        ';left:'+(Math.random()*100).toFixed(2)+'%;top:'+(Math.random()*64).toFixed(2)+'%;box-shadow:0 0 '+(sz*2)+'px '+c+
        ';animation:twinkle '+(2.2+Math.random()*4).toFixed(2)+'s ease-in-out infinite '+(Math.random()*4).toFixed(2)+'s;';
      layer.appendChild(s);
    }
  }

  boot() {
    if (this.booted) return;
    this.booted = true;
    this.frames = {};
    this.stage.querySelectorAll('img[data-key]').forEach(im => { this.frames[im.dataset.key] = im; });
    this.curKey = 'blink1';
    this.scaleEl = this.scaleEl || this.stage.parentElement;
    this.scene   = this.scene   || (this.scaleEl && this.scaleEl.parentElement);
    if (this.scaleEl) this.scaleEl.style.transformOrigin = 'top center';
    this.applyScene();
    this.makeStars();

    const E = Component;
    this.segs = [
      { dur: 1.30, fn: () => ({ key:'blink1' }) },
      { dur: 0.07, fn: () => ({ key:'blink2' }) },
      { dur: 0.10, fn: () => ({ key:'blink3' }) },
      { dur: 0.07, fn: () => ({ key:'blink4' }) },
      { dur: 0.55, fn: () => ({ key:'blink1' }) },
      { dur: 0.22, fn: (lt) => ({ key:'wave2', rot: -2*E.easeOut(lt) }) },
      { dur: 0.90, fn: (lt) => {
          const k = (lt*6)%2 < 1 ? 'wave3' : 'wave4';
          return { key:k, rot: -2 + Math.sin(lt*Math.PI*6)*2.2 };
        } },
      { dur: 0.18, fn: (lt) => ({ key:'wave2', rot: -2*(1-E.easeInOut(lt)) }) },
      { dur: 0.55, fn: () => ({ key:'wave1' }) },
      { dur: 0.16, fn: (lt) => { const e=E.easeInOut(lt); return { key:'jump1', ty: 8*e, sy: 1-0.07*e, sx: 1+0.05*e }; } },
      { dur: 0.12, fn: (lt) => { const e=E.easeInOut(lt); return { key:'jump2', ty: 8+10*e, sy: 0.93-0.07*e, sx: 1.05+0.04*e }; } },
      { dur: 0.50, fn: (lt) => {
          const H = 168;
          const ty = -H*Math.sin(lt*Math.PI);
          const st = Math.cos(lt*Math.PI);
          return { key:'jump3', ty, sy: 1+0.06*st, sx: 1-0.05*st, rot: Math.sin(lt*Math.PI*2)*3 };
        } },
      { dur: 0.12, fn: (lt) => { const e=E.easeOut(lt); return { key:'jump4', ty: 10*(1-e)+8, sy: 0.84, sx: 1.12 }; } },
      { dur: 0.18, fn: (lt) => { const e=E.easeOut(lt); const s=0.84+(1.04-0.84)*e; return { key:'jump5', ty: 8*(1-e), sy: s>1?1+(s-1)*(1-lt):s, sx: 2-(s>1?1+(s-1)*(1-lt):s) }; } },
      { dur: 1.20, fn: () => ({ key:'blink1' }) },
    ];
    this.TOTAL = this.segs.reduce((a,s)=>a+s.dur,0);
    this.NB = 2;

    this._onResize = () => this.applyScene();
    window.addEventListener('resize', this._onResize);

    this.t0 = performance.now();
    this.tick = this.tick.bind(this);
    this.raf = requestAnimationFrame(this.tick);
  }

  setFrame(key){
    if (key === this.curKey) return;
    const prev = this.frames[this.curKey];
    const next = this.frames[key];
    if (prev) prev.style.opacity = '0';
    if (next) next.style.opacity = '1';
    this.curKey = key;
  }

  tick(now){
    const speed = this.props.speed != null ? this.props.speed : 1;
    let te = ((now - this.t0)/1000) * speed;
    if (typeof window !== 'undefined' && window.__monScrub != null) te = window.__monScrub * this.TOTAL;
    te = te % this.TOTAL;
    if (te < 0) te += this.TOTAL;

    if (this.scaleEl) {
      const cs = this.props.characterScale != null ? this.props.characterScale : 1;
      const innerH = window.innerHeight, innerW = window.innerWidth;
      const baseY = innerH * 0.585;
      const baseFit = Math.min((innerW - 24) / 560, (baseY - 14) / 398, 1.55);
      const scale = Math.max(0.2, baseFit) * cs;
      const top = (baseY - 594 * scale);
      const tf = 'translateX(-50%) scale(' + scale.toFixed(3) + ')';
      if (this.scaleEl.style.left !== '50%') this.scaleEl.style.left = '50%';
      const topStr = top.toFixed(1) + 'px';
      if (this.scaleEl.style.top !== topStr) this.scaleEl.style.top = topStr;
      if (this.scaleEl.style.transform !== tf) this.scaleEl.style.transform = tf;
    }

    let acc = 0, seg = this.segs[0], lt = 0;
    for (const s of this.segs){
      if (te < acc + s.dur){ seg = s; lt = (te - acc)/s.dur; break; }
      acc += s.dur;
    }
    const b = seg.fn(Math.min(Math.max(lt,0),1)) || {};
    const baseTy = b.ty || 0, baseSy = b.sy != null ? b.sy : 1, baseSx = b.sx != null ? b.sx : 1;
    const baseRot = b.rot || 0, baseTx = b.tx || 0;

    const ph = te / this.TOTAL;
    const br = Math.sin(ph * Math.PI * 2 * this.NB);
    const sway = Math.sin(ph * Math.PI * 2) * 1.3;
    const micro = Math.sin(ph * Math.PI * 2 * 3) * 1.1;
    const floaty = Math.sin(ph * Math.PI * 2) * -5;   // dreamy hover
    const ty = baseTy + br * -2.6 + floaty;
    const sy = baseSy * (1 + br * 0.018);
    const sx = baseSx * (1 - br * 0.012);
    const rot = baseRot + sway;
    const tx = baseTx + micro;

    this.stage.style.transform =
      'translate(' + tx.toFixed(2) + 'px,' + ty.toFixed(2) + 'px) rotate(' + rot.toFixed(2) + 'deg) scale(' + sx.toFixed(3) + ',' + sy.toFixed(3) + ')';

    this.setFrame(b.key || 'blink1');

    if (this.shadow){
      const lift = Math.max(0, -baseTy);
      const r = Math.min(1, lift / 168);
      const sq = baseSy < 1 ? (1 - baseSy) : 0;
      const scl = (1 - 0.42*r) * (1 + sq*1.1);
      this.shadow.style.transform = 'translateX(-50%) scale(' + scl.toFixed(3) + ',' + scl.toFixed(3) + ')';
      this.shadow.style.opacity = (0.95 - 0.5*r).toFixed(3);
    }

    this.raf = requestAnimationFrame(this.tick);
  }

  componentWillUnmount(){ if (this.raf) cancelAnimationFrame(this.raf); if (this._onResize) window.removeEventListener('resize', this._onResize); }

  renderVals(){
    return {
      sceneRef: this.refScene,
      scaleRef: this.refScale,
      shadowRef: this.refShadow,
      headRef: this.refHead,
      subRef: this.refSub,
      stageRef: this.refStage,
    };
  }
}
</script>
</body>
</html>

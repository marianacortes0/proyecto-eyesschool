sonar.projectKey=marianacortes0_proyecto-eyesschool
sonar.organization=marianacortes0
sonar.sources=src,proxy.ts
sonar.tests=tests
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Páginas informativas (WEB-INF-4); sí entran en ESLint y tsc.
sonar.exclusions=src/app/home/**,src/components/home/**,.next/**,coverage/**,e2e/**,public/**

# D-WEB-11: fuera del CÁLCULO de cobertura, no del análisis (Sonar sigue
# buscándoles bugs, smells y problemas de seguridad). Son las vistas que D-WEB-05
# asigna a los E2E del PR-06, no a las unitarias. NO se excluyen src/hooks,
# src/lib, src/services ni src/app/api/** (el proxy tiene sus pruebas).
# Los componentes con lógica y prueba propia (PasswordChecklist, SelectorHijo,
# RegistroMasivo, FallidosMasivo) quedan dentro: por eso la lista va archivo por
# archivo en vez de src/components/**.
sonar.coverage.exclusions=\
  src/app/**/page.tsx,\
  src/app/**/layout.tsx,\
  src/app/**/loading.tsx,\
  src/app/**/error.tsx,\
  src/app/**/not-found.tsx,\
  src/components/asistencia/AsistenciaModal.tsx,\
  src/components/asistencia/AsistenciaTable.tsx,\
  src/components/auth/Protected.tsx,\
  src/components/home/**,\
  src/components/layout/**,\
  src/components/legal/**,\
  src/components/panel/**,\
  src/components/qr/QRAdminView.tsx,\
  src/components/qr/QRCard.tsx,\
  src/components/qr/QRCodigoModal.tsx,\
  src/components/qr/QRCodigosTable.tsx,\
  src/components/qr/QREstudianteView.tsx,\
  src/components/qr/QRScannerView.tsx,\
  src/components/ui/**,\
  src/components/usuarios/**,\
  src/types/**,\
  proxy.ts
